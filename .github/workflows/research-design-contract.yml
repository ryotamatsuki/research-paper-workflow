name: Research design contract (v3.2)
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'templates/**'
      - 'GOVERNANCE.md'
      - 'THEORY_PAPER_RESEARCH_PIPELINE.md'
      - 'README.md'
      - 'docs/V3_2_*.md'
      - 'docs/VERSIONING_POLICY.md'
      - 'checklists/**'
      - 'theory-discovery/README.md'
      - 'theory-discovery/AGENTS.md'
      - 'theory-discovery/v5.1/README.md'
      - 'WORKFLOW_VERSION'
      - 'scripts/verify_research_design_contract.py'
      - 'scripts/verify_current_version.py'
      - 'tests/fixtures/research_design_cases.json'
      - '.github/workflows/research-design-contract.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current active versions and independent TDF version
        run: python3 scripts/verify_current_version.py
      - name: Run six research decision regressions and stage contract
        run: python3 scripts/verify_research_design_contract.py
      - name: Verify actual pinned Green Stage 6/7.5/11/12 and model evidence
        run: python3 scripts/verify_research_design_contract.py --verify-green-sources
      - name: Run prior v3.1 prose integration contract
        run: python3 scripts/verify_integrated_prose_contract.py
      - name: Run existing TDF v5.1 unit tests
        run: PYTHONPATH=theory-discovery/v5.1 python3 -m unittest discover -s theory-discovery/v5.1/tests -p 'test_*.py' -v
      - name: Run existing TDF v5.1 scenario replay
        run: python3 theory-discovery/v5.1/validation/replay.py > /dev/null
