name: Publish research-paper-workflow v3.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish-v3-0:
    if: github.repository == 'ryotamatsuki/research-paper-workflow' && contains(github.event.head_commit.message, 'Publish research-paper-workflow v3.0')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed main snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate mandatory pre-writing architecture, prior tag, and tag immutability
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/V3_0_RELEASE_MANIFEST.md
          test -s docs/V3_0_RELEASE_NOTES.md
          grep -Fq '**WORKFLOW v3.0 READY**' docs/V3_0_INTEGRATION_AUDIT.md
          grep -Fq 'WORKFLOW v3.0 RELEASE READY' docs/V3_0_READINESS_CHECKLIST.md
          grep -Fq 'Version: v3.0' GOVERNANCE.md
          grep -Fq 'Version: v3.0' THEORY_PAPER_RESEARCH_PIPELINE.md
          grep -Fq 'Stage 10A' templates/STAGE_10A_EXEMPLARY_PAPER_BENCHMARKING.md
          grep -Fq 'Stage 10B' templates/STAGE_10_PAPER_BUILD.md
          grep -Fq 'Full-text acquisition is a hard eligibility filter' templates/STAGE_10A_EXEMPLARY_PAPER_BENCHMARKING.md
          grep -Fq 'EDITORIAL_EXEMPLAR_MAP.md' templates/STAGE_10A_EXEMPLARY_PAPER_BENCHMARKING.md
          grep -Fq 'MANUSCRIPT_BLUEPRINT.md' templates/STAGE_10A_EXEMPLARY_PAPER_BENCHMARKING.md
          git rev-parse --verify refs/tags/v2.9 >/dev/null
          git merge-base --is-ancestor refs/tags/v2.9 HEAD
          if git ls-remote --exit-code --tags origin refs/tags/v3.0 >/dev/null 2>&1; then
            echo 'Immutable v3.0 tag already exists; refusing overwrite.' >&2
            exit 1
          fi
      - name: Publish immutable v3.0 tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v3.0 --target "$GITHUB_SHA" --title 'research-paper-workflow v3.0' --notes-file docs/V3_0_RELEASE_NOTES.md
