name: publish-v3-1-release
on:
  push:
    branches: [main]
    paths:
      - 'docs/V3_1_RELEASE_NOTES.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage 11/13 contract
        run: python scripts/verify_integrated_prose_contract.py
      - name: Verify original v3.0 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found="$(gh api repos/${GITHUB_REPOSITORY}/git/ref/tags/v3.0 --jq '.object.sha')"
          test "$found" = '7464e290775741f1435602ad655878a70e1f7b7e'
      - name: Publish immutable v3.1 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.1 >/dev/null 2>&1; then
            echo 'v3.1 Release exists; leaving immutable tag and release untouched'
            exit 0
          fi
          gh release create v3.1 --target "${GITHUB_SHA}" --title 'research-paper-workflow v3.1' --notes-file docs/V3_1_RELEASE_NOTES.md
