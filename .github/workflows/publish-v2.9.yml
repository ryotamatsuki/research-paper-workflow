name: Publish v2.9 after readiness audit

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish-v2-9:
    if: github.repository == 'ryotamatsuki/research-paper-workflow' && contains(github.event.head_commit.message, 'Publish research-paper-workflow v2.9')
    runs-on: ubuntu-latest

    steps:
      - name: Check out reviewed main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify v2.9 readiness, baseline ancestry and immutable tag namespace
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '**`WORKFLOW v2.9 READY`**' docs/V2_9_INTEGRATION_AUDIT.md
          grep -Fq '[x] **`WORKFLOW v2.9 READY`**' docs/V2_9_READINESS_CHECKLIST.md
          test -s docs/V2_9_RELEASE_MANIFEST.md
          test -s docs/V2_9_RELEASE_NOTES.md
          test -s docs/ECONOMIC_CONTRIBUTION_COMPLETENESS_REFINEMENT_2026-10-10.md
          test -s docs/FRONTIER_OPPORTUNITY_REFINEMENT_2026-10-12.md
          test -s checklists/ECONOMIC_CONTRIBUTION_COMPLETENESS_CHECKLIST.md
          test -s checklists/FRONTIER_OPPORTUNITY_CHECKLIST.md
          test -s templates/FRONTIER_OPPORTUNITY_REGISTER.md
          grep -Fq 'Version: v2.9' GOVERNANCE.md
          grep -Fq 'Version: v2.9' THEORY_PAPER_RESEARCH_PIPELINE.md
          grep -Fq 'Current canonical repository revision: **v2.9**' README.md

          git rev-parse --verify refs/tags/v2.8 >/dev/null
          git merge-base --is-ancestor refs/tags/v2.8 HEAD

          if git ls-remote --exit-code --tags origin refs/tags/v2.9 >/dev/null 2>&1; then
            echo 'v2.9 tag already exists; refusing to overwrite an immutable release tag.' >&2
            exit 1
          fi

      - name: Publish v2.9 tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v2.9 \
            --target "$GITHUB_SHA" \
            --title 'research-paper-workflow v2.9' \
            --notes-file docs/V2_9_RELEASE_NOTES.md
