name: stage13p-structural-contract

on:
  pull_request:
    paths:
      - "GOVERNANCE.md"
      - "THEORY_PAPER_RESEARCH_PIPELINE.md"
      - "README.md"
      - "docs/VERSIONING_POLICY.md"
      - "docs/STAGE13P_PUBLICATION_PROSE_GATE_DESIGN_2026-11-19.md"
      - "templates/STAGE_1*.md"
      - "checklists/*PROSE*.md"
      - "checklists/SUBMISSION_CHECKLIST.md"
      - "examples/PUBLICATION_PROSE_REVIEW_REGRESSION.md"
      - "scripts/verify_stage13p_contract.py"
      - ".github/workflows/stage13p-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-and-evidence-smoke-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Stage13P contract and no prose-scope misrepresentation
        run: python scripts/verify_stage13p_contract.py
